spring.application.name=ws
server.port=8080

# Battlecode team dashboard (ws.mia.website.battlecode)
# hosts: hosts whose "/" is the dashboard (it is also at /battlecode/ on every host)
# feed: public URL of the team's status.json, read by the browser; empty shows "no feed configured".
#       Can also be set without a commit via BATTLECODE_FEED in the Poseidon secrets file.
battlecode.hosts=battlecode.mia.ws
battlecode.feed=
